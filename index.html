<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL NOTE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    background: #ffffff;
    color: #111111;
    overflow: hidden;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    color: inherit;
}

/* =========================
   アプリ全体
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   ヘッダー
========================= */

.header {
    height: 58px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #d7d7d7;
    background: #ffffff;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.7px;
}

.logo-line {
    width: 1px;
    height: 20px;
    background: #cfcfcf;
}

.current-date {
    font-size: 12px;
    color: #555555;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-button {
    height: 34px;

    padding: 0 13px;

    border: 1px solid #cfcfcf;
    background: #ffffff;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.header-button:hover {
    background: #f4f4f4;
}

.header-button.primary {
    border-color: #111111;
    background: #111111;
    color: #ffffff;
}

.header-button.primary:hover {
    background: #292929;
}

/* =========================
   メイン
========================= */

.main {
    flex: 1;
    min-height: 0;

    display: flex;
}

/* =========================
   サイドバー
========================= */

.sidebar {
    width: 275px;
    flex-shrink: 0;

    border-right: 1px solid #d7d7d7;

    background: #fafafa;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* 検索 */

.search-area {
    padding: 14px 14px 12px;
}

.search-box {
    width: 100%;
    height: 34px;

    border: 1px solid #d2d2d2;
    background: #ffffff;

    outline: none;

    padding: 0 11px;

    font-size: 12px;
    color: #111111;
}

.search-box:focus {
    border-color: #111111;
}

.search-box::placeholder {
    color: #999999;
}

/* =========================
   カレンダー
========================= */

.calendar-section {
    padding: 0 14px 14px;

    border-bottom: 1px solid #dddddd;
}

.calendar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    height: 38px;
}

.month-label {
    font-size: 13px;
    font-weight: 900;
}

.month-controls {
    display: flex;
    gap: 2px;
}

.month-button {
    width: 27px;
    height: 27px;

    border: 0;
    background: transparent;

    cursor: pointer;

    font-size: 16px;
    line-height: 1;
}

.month-button:hover {
    background: #e9e9e9;
}

.calendar-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);

    margin-bottom: 3px;
}

.weekday {
    text-align: center;

    font-size: 9px;
    font-weight: 800;

    color: #777777;

    padding: 4px 0;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);

    gap: 2px;
}

.day {
    position: relative;

    height: 29px;

    border: 0;
    background: transparent;

    cursor: pointer;

    font-size: 11px;
    color: #222222;
}

.day:hover {
    background: #e9e9e9;
}

.day.other-month {
    color: #b8b8b8;
}

.day.today {
    font-weight: 900;
}

.day.selected {
    background: #111111;
    color: #ffffff;
}

.day.has-note::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 3px;

    width: 3px;
    height: 3px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: #111111;
}

.day.selected.has-note::after {
    background: #ffffff;
}

/* =========================
   サイド下部
========================= */

.sidebar-bottom {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

.sidebar-title {
    height: 40px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    font-size: 11px;
    font-weight: 900;

    border-bottom: 1px solid #e0e0e0;
}

.note-list {
    flex: 1;
    min-height: 0;

    overflow-y: auto;
}

.note-item {
    position: relative;

    padding: 11px 14px;

    border-bottom: 1px solid #e8e8e8;

    cursor: pointer;
}

.note-item:hover {
    background: #f0f0f0;
}

.note-item.active {
    background: #e7e7e7;
}

.note-item-title {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 12px;
    font-weight: 800;

    margin-bottom: 4px;
}

.note-item-preview {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    color: #777777;

    font-size: 10px;
}

.note-item-date {
    margin-top: 5px;

    color: #999999;

    font-size: 9px;
}

.empty-list {
    padding: 25px 14px;

    color: #999999;

    font-size: 11px;
    line-height: 1.7;
}

/* =========================
   エディタ
========================= */

.editor-area {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: #ffffff;
}

.editor-top {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid #e5e5e5;
}

.editor-heading {
    min-width: 0;
}

.editor-date {
    font-size: 11px;
    color: #777777;

    margin-bottom: 3px;
}

.editor-title {
    width: 100%;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    color: #111111;

    font-size: 18px;
    font-weight: 900;
}

.editor-title::placeholder {
    color: #aaa;
}

.editor-status {
    flex-shrink: 0;

    font-size: 10px;
    color: #999999;
}

/* =========================
   本文
========================= */

.editor-body {
    flex: 1;
    min-height: 0;

    padding: 30px;

    overflow-y: auto;
}

.editor {
    width: 100%;
    height: 100%;

    min-height: 300px;

    resize: none;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    color: #000000;

    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    font-size: 15px;
    line-height: 1.9;
}

.editor::placeholder {
    color: #999999;
}

/* =========================
   下部ステータス
========================= */

.statusbar {
    height: 32px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px 0 30px;

    border-top: 1px solid #e5e5e5;

    color: #888888;

    font-size: 10px;
}

.status-left,
.status-right {
    display: flex;
    align-items: center;
    gap: 14px;
}

/* =========================
   モバイル
========================= */

@media (max-width: 760px) {

    body {
        overflow: auto;
    }

    .header {
        padding: 0 12px;
    }

    .logo-line,
    .current-date {
        display: none;
    }

    .header-button:not(.primary) {
        display: none;
    }

    .main {
        height: calc(100vh - 58px);
    }

    .sidebar {
        width: 210px;
    }

    .editor-top {
        padding: 0 18px;
    }

    .editor-body {
        padding: 20px 18px;
    }

    .statusbar {
        padding-left: 18px;
    }
}

@media (max-width: 560px) {

    .sidebar {
        width: 175px;
    }

    .calendar-section {
        padding-left: 8px;
        padding-right: 8px;
    }

    .search-area {
        padding-left: 8px;
        padding-right: 8px;
    }

    .sidebar-title {
        padding-left: 8px;
    }

    .note-item {
        padding-left: 8px;
        padding-right: 8px;
    }

    .editor-top {
        padding: 0 12px;
    }

    .editor-body {
        padding: 18px 12px;
    }

    .statusbar {
        padding-left: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         ヘッダー
    ========================== -->

    <header class="header">

        <div class="logo-area">

            <div class="logo">
                DOL NOTE
            </div>

            <div class="logo-line"></div>

            <div class="current-date" id="currentDate">
                2026年9月28日
            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-button"
                id="todayButton"
            >
                今日
            </button>

            <button
                class="header-button"
                id="saveTxtButton"
            >
                TXT保存
            </button>

            <button
                class="header-button primary"
                id="newButton"
            >
                ＋ 新しいメモ
            </button>

        </div>

    </header>


    <!-- =========================
         メイン
    ========================== -->

    <main class="main">

        <!-- =====================
             左サイド
        ====================== -->

        <aside class="sidebar">

            <div class="search-area">

                <input
                    type="search"
                    class="search-box"
                    id="searchInput"
                    placeholder="メモを検索"
                >

            </div>


            <!-- カレンダー -->

            <section class="calendar-section">

                <div class="calendar-top">

                    <div
                        class="month-label"
                        id="monthLabel"
                    >
                        2026年9月
                    </div>

                    <div class="month-controls">

                        <button
                            class="month-button"
                            id="prevMonth"
                            title="前の月"
                        >
                            ‹
                        </button>

                        <button
                            class="month-button"
                            id="nextMonth"
                            title="次の月"
                        >
                            ›
                        </button>

                    </div>

                </div>


                <div class="calendar-week">

                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>

                </div>


                <div
                    class="calendar-grid"
                    id="calendarGrid"
                ></div>

            </section>


            <!-- メモ一覧 -->

            <section class="sidebar-bottom">

                <div class="sidebar-title">
                    メモ
                </div>

                <div
                    class="note-list"
                    id="noteList"
                ></div>

            </section>

        </aside>


        <!-- =====================
             エディタ
        ====================== -->

        <section class="editor-area">

            <div class="editor-top">

                <div class="editor-heading">

                    <div
                        class="editor-date"
                        id="editorDate"
                    >
                        メモ
                    </div>

                    <input
                        class="editor-title"
                        id="titleInput"
                        placeholder="タイトルなし"
                        autocomplete="off"
                    >

                </div>

                <div
                    class="editor-status"
                    id="editorStatus"
                >
                    保存済み
                </div>

            </div>


            <div class="editor-body">

                <textarea
                    class="editor"
                    id="editor"
                    spellcheck="true"
                    placeholder="ここにメモを書く..."
                ></textarea>

            </div>


            <div class="statusbar">

                <div class="status-left">

                    <span id="wordCount">
                        0文字
                    </span>

                    <span id="lineCount">
                        1行
                    </span>

                </div>

                <div class="status-right">

                    <span>
                        自動保存
                    </span>

                    <span id="saveStatus">
                        保存済み
                    </span>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

/* =========================================================
   DOL NOTE
========================================================= */

const STORAGE_KEY = "DOL_NOTE_DATA_V1";


/* =========================
   状態
========================= */

let notes = [];

let selectedNoteId = null;

let calendarYear;
let calendarMonth;


/* =========================
   今日
========================= */

const today = new Date();

calendarYear = today.getFullYear();
calendarMonth = today.getMonth();


/* =========================
   DOM
========================= */

const calendarGrid =
    document.getElementById("calendarGrid");

const monthLabel =
    document.getElementById("monthLabel");

const noteList =
    document.getElementById("noteList");

const titleInput =
    document.getElementById("titleInput");

const editor =
    document.getElementById("editor");

const editorDate =
    document.getElementById("editorDate");

const editorStatus =
    document.getElementById("editorStatus");

const saveStatus =
    document.getElementById("saveStatus");

const wordCount =
    document.getElementById("wordCount");

const lineCount =
    document.getElementById("lineCount");

const searchInput =
    document.getElementById("searchInput");


/* =========================
   保存データ読み込み
========================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            notes = [];

            createInitialNote();

            return;

        }

        const data = JSON.parse(saved);

        if (Array.isArray(data)) {
            notes = data;
        } else {
            notes = [];
        }

    } catch {

        notes = [];

    }

}


/* =========================
   データ保存
========================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

    saveStatus.textContent = "保存済み";

}


/* =========================
   初期メモ
========================= */

function createInitialNote() {

    const now = new Date();

    const note = {

        id: createId(),

        title: "",

        content: "",

        date: formatDateKey(now),

        updated: Date.now()

    };

    notes.push(note);

    selectedNoteId = note.id;

    saveData();

}


/* =========================
   ID
========================= */

function createId() {

    return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
    );

}


/* =========================
   日付キー
========================= */

function formatDateKey(date) {

    const y = date.getFullYear();

    const m =
        String(date.getMonth() + 1)
        .padStart(2, "0");

    const d =
        String(date.getDate())
        .padStart(2, "0");

    return `${y}-${m}-${d}`;

}


/* =========================
   表示用日付
========================= */

function formatJapaneseDate(dateKey) {

    const parts = dateKey.split("-");

    return `${Number(parts[0])}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================
   今日の判定
========================= */

function isToday(dateKey) {

    return dateKey === formatDateKey(new Date());

}


/* =========================
   カレンダー描画
========================= */

function renderCalendar() {

    monthLabel.textContent =
        `${calendarYear}年${calendarMonth + 1}月`;

    calendarGrid.innerHTML = "";


    const firstDay =
        new Date(
            calendarYear,
            calendarMonth,
            1
        );

    const lastDay =
        new Date(
            calendarYear,
            calendarMonth + 1,
            0
        );


    const startWeekday =
        firstDay.getDay();

    const daysInMonth =
        lastDay.getDate();


    /* 前月 */

    const previousLastDay =
        new Date(
            calendarYear,
            calendarMonth,
            0
        ).getDate();


    for (
        let i = startWeekday - 1;
        i >= 0;
        i--
    ) {

        const dayNumber =
            previousLastDay - i;

        const date =
            new Date(
                calendarYear,
                calendarMonth - 1,
                dayNumber
            );

        addCalendarDay(
            date,
            true
        );

    }


    /* 今月 */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                calendarYear,
                calendarMonth,
                day
            );

        addCalendarDay(
            date,
            false
        );

    }


    /* 次月 */

    const totalCells =
        startWeekday + daysInMonth;

    const remaining =
        Math.ceil(totalCells / 7) * 7
        - totalCells;


    for (
        let day = 1;
        day <= remaining;
        day++
    ) {

        const date =
            new Date(
                calendarYear,
                calendarMonth + 1,
                day
            );

        addCalendarDay(
            date,
            true
        );

    }

}


/* =========================
   カレンダーの日付
========================= */

function addCalendarDay(
    date,
    otherMonth
) {

    const key =
        formatDateKey(date);


    const button =
        document.createElement("button");

    button.className = "day";

    if (otherMonth) {
        button.classList.add("other-month");
    }

    if (isToday(key)) {
        button.classList.add("today");
    }

    if (
        notes.some(
            note => note.date === key
        )
    ) {
        button.classList.add("has-note");
    }

    if (
        selectedNoteId &&
        getSelectedNote() &&
        getSelectedNote().date === key
    ) {
        button.classList.add("selected");
    }


    button.textContent =
        date.getDate();


    button.addEventListener(
        "click",
        () => {

            selectDate(key);

        }
    );


    calendarGrid.appendChild(button);

}


/* =========================
   日付を選択
========================= */

function selectDate(dateKey) {

    const sameDateNotes =
        notes.filter(
            note => note.date === dateKey
        );


    if (sameDateNotes.length > 0) {

        const newest =
            [...sameDateNotes]
                .sort(
                    (a, b) =>
                        b.updated - a.updated
                )[0];

        openNote(newest.id);

    } else {

        createNoteForDate(dateKey);

    }

}


/* =========================
   日付指定でメモ作成
========================= */

function createNoteForDate(dateKey) {

    const note = {

        id: createId(),

        title: "",

        content: "",

        date: dateKey,

        updated: Date.now()

    };

    notes.push(note);

    selectedNoteId = note.id;

    saveData();

    renderAll();

    titleInput.focus();

}


/* =========================
   新しい普通のメモ
========================= */

function createNewNote() {

    const now =
        new Date();

    const note = {

        id: createId(),

        title: "",

        content: "",

        date: formatDateKey(now),

        updated: Date.now()

    };

    notes.push(note);

    selectedNoteId = note.id;

    calendarYear =
        now.getFullYear();

    calendarMonth =
        now.getMonth();

    saveData();

    renderAll();

    titleInput.focus();

}


/* =========================
   メモを開く
========================= */

function openNote(id) {

    const note =
        notes.find(
            note => note.id === id
        );

    if (!note) {
        return;
    }

    selectedNoteId = id;

    const date =
        new Date(
            note.date + "T00:00:00"
        );

    calendarYear =
        date.getFullYear();

    calendarMonth =
        date.getMonth();

    renderAll();

    editor.focus();

}


/* =========================
   選択中メモ
========================= */

function getSelectedNote() {

    return notes.find(
        note => note.id === selectedNoteId
    );

}


/* =========================
   エディタ表示
========================= */

function loadEditor() {

    const note =
        getSelectedNote();

    if (!note) {
        return;
    }

    titleInput.value =
        note.title || "";

    editor.value =
        note.content || "";

    editorDate.textContent =
        formatJapaneseDate(
            note.date
        );

    updateStats();

}


/* =========================
   入力変更
========================= */

function updateCurrentNote() {

    const note =
        getSelectedNote();

    if (!note) {
        return;
    }

    note.title =
        titleInput.value;

    note.content =
        editor.value;

    note.updated =
        Date.now();

    saveStatus.textContent =
        "保存中...";

    saveData();

    renderNoteList();

    renderCalendar();

    updateStats();

    setTimeout(
        () => {

            saveStatus.textContent =
                "保存済み";

        },
        300
    );

}


/* =========================
   統計
========================= */

function updateStats() {

    const text =
        editor.value;

    wordCount.textContent =
        `${text.length}文字`;

    const lines =
        text.length === 0
            ? 1
            : text.split("\n").length;

    lineCount.textContent =
        `${lines}行`;

}


/* =========================
   メモ一覧
========================= */

function renderNoteList() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    let filtered =
        [...notes];


    if (keyword) {

        filtered =
            filtered.filter(note => {

                const target =
                    `${note.title} ${note.content}`
                        .toLowerCase();

                return target.includes(keyword);

            });

    }


    filtered.sort(
        (a, b) =>
            b.updated - a.updated
    );


    if (filtered.length === 0) {

        noteList.innerHTML = `

            <div class="empty-list">
                メモがありません。
            </div>

        `;

        return;

    }


    noteList.innerHTML =
        filtered.map(note => {

            const title =
                note.title.trim()
                    || "タイトルなし";


            const preview =
                note.content
                    .replace(/\n/g, " ")
                    .trim()
                    || "本文なし";


            return `

                <div
                    class="note-item ${
                        note.id === selectedNoteId
                            ? "active"
                            : ""
                    }"
                    data-id="${note.id}"
                >

                    <div class="note-item-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="note-item-preview">
                        ${escapeHTML(preview)}
                    </div>

                    <div class="note-item-date">
                        ${formatJapaneseDate(note.date)}
                    </div>

                </div>

            `;

        }).join("");


    document
        .querySelectorAll(".note-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    openNote(
                        item.dataset.id
                    );

                }
            );

        });

}


/* =========================
   全体描画
========================= */

function renderAll() {

    renderCalendar();

    renderNoteList();

    loadEditor();

}


/* =========================
   削除
========================= */

function deleteCurrentNote() {

    const note =
        getSelectedNote();

    if (!note) {
        return;
    }


    const index =
        notes.findIndex(
            item =>
                item.id === note.id
        );


    if (index === -1) {
        return;
    }


    const confirmed =
        confirm(
            "このメモを削除しますか？"
        );


    if (!confirmed) {
        return;
    }


    notes.splice(
        index,
        1
    );


    if (notes.length === 0) {

        createInitialNote();

    } else {

        const next =
            notes[
                Math.max(
                    0,
                    index - 1
                )
            ];

        selectedNoteId =
            next.id;

    }


    saveData();

    renderAll();

}


/* =========================
   TXT保存
========================= */

function saveTxt() {

    const note =
        getSelectedNote();

    if (!note) {
        return;
    }


    const title =
        note.title.trim()
        || "メモ";


    const text =
`${title}

${formatJapaneseDate(note.date)}

${note.content}`;


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `${title}.txt`;

    a.click();


    URL.revokeObjectURL(url);

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   今日
========================= */

function goToday() {

    const now =
        new Date();

    calendarYear =
        now.getFullYear();

    calendarMonth =
        now.getMonth();


    const todayKey =
        formatDateKey(now);


    const existing =
        notes.find(
            note =>
                note.date === todayKey
        );


    if (existing) {

        openNote(existing.id);

    } else {

        createNoteForDate(
            todayKey
        );

    }

}


/* =========================
   月移動
========================= */

document
    .getElementById("prevMonth")
    .addEventListener(
        "click",
        () => {

            calendarMonth--;

            if (calendarMonth < 0) {

                calendarMonth = 11;
                calendarYear--;

            }

            renderCalendar();

        }
    );


document
    .getElementById("nextMonth")
    .addEventListener(
        "click",
        () => {

            calendarMonth++;

            if (calendarMonth > 11) {

                calendarMonth = 0;
                calendarYear++;

            }

            renderCalendar();

        }
    );


/* =========================
   ボタン
========================= */

document
    .getElementById("newButton")
    .addEventListener(
        "click",
        createNewNote
    );


document
    .getElementById("todayButton")
    .addEventListener(
        "click",
        goToday
    );


document
    .getElementById("saveTxtButton")
    .addEventListener(
        "click",
        saveTxt
    );


/* =========================
   入力
========================= */

titleInput.addEventListener(
    "input",
    updateCurrentNote
);


editor.addEventListener(
    "input",
    updateCurrentNote
);


searchInput.addEventListener(
    "input",
    renderNoteList
);


/* =========================
   キーボード
========================= */

document.addEventListener(
    "keydown",
    event => {

        /* Ctrl + S */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveData();

            saveStatus.textContent =
                "保存済み";

        }


        /* Ctrl + N */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "n"
        ) {

            event.preventDefault();

            createNewNote();

        }


        /* Ctrl + F */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            searchInput.focus();

        }

    }
);


/* =========================
   起動
========================= */

loadData();

if (!selectedNoteId) {

    if (notes.length > 0) {

        selectedNoteId =
            [...notes]
                .sort(
                    (a, b) =>
                        b.updated - a.updated
                )[0].id;

    }

}


if (!selectedNoteId) {

    createInitialNote();

}


renderAll();


/* =========================
   ヘッダーの日付
========================= */

function updateHeaderDate() {

    const now =
        new Date();

    document
        .getElementById("currentDate")
        .textContent =
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

}

updateHeaderDate();

</script>

</body>
</html>
