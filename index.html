<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL NOTE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    background: #ffffff;
    color: #111111;
    overflow: hidden;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    color: inherit;
}

/* ========================================
   アプリ
======================================== */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ========================================
   ヘッダー
======================================== */

.header {
    height: 58px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #d7d7d7;

    background: #ffffff;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.7px;
}

.logo-line {
    width: 1px;
    height: 20px;
    background: #cfcfcf;
}

.current-date {
    font-size: 12px;
    color: #555555;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-button {
    height: 34px;

    padding: 0 13px;

    border: 1px solid #cfcfcf;
    background: #ffffff;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.header-button:hover {
    background: #f4f4f4;
}

.header-button.primary {
    border-color: #111111;
    background: #111111;
    color: #ffffff;
}

.header-button.primary:hover {
    background: #292929;
}

/* ========================================
   メイン
======================================== */

.main {
    flex: 1;
    min-height: 0;

    display: flex;
}

/* ========================================
   サイドバー
======================================== */

.sidebar {
    width: 285px;
    flex-shrink: 0;

    border-right: 1px solid #d7d7d7;

    background: #fafafa;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* ========================================
   検索
======================================== */

.search-area {
    padding: 14px 14px 12px;
}

.search-box {
    width: 100%;
    height: 34px;

    border: 1px solid #d2d2d2;

    background: #ffffff;

    outline: none;

    padding: 0 11px;

    font-size: 12px;

    color: #111111;
}

.search-box:focus {
    border-color: #111111;
}

.search-box::placeholder {
    color: #999999;
}

/* ========================================
   カレンダー
======================================== */

.calendar-section {
    padding: 0 14px 14px;

    border-bottom: 1px solid #dddddd;
}

.calendar-top {
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.month-label {
    font-size: 13px;
    font-weight: 900;
}

.month-controls {
    display: flex;
    gap: 2px;
}

.month-button {
    width: 27px;
    height: 27px;

    border: 0;

    background: transparent;

    cursor: pointer;

    font-size: 16px;

    line-height: 1;
}

.month-button:hover {
    background: #e9e9e9;
}

.calendar-week {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    margin-bottom: 3px;
}

.weekday {
    padding: 4px 0;

    text-align: center;

    font-size: 9px;
    font-weight: 800;

    color: #777777;
}

.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 2px;
}

.day {
    position: relative;

    height: 29px;

    border: 0;

    background: transparent;

    cursor: pointer;

    font-size: 11px;

    color: #222222;
}

.day:hover {
    background: #e9e9e9;
}

.day.other-month {
    color: #b8b8b8;
}

.day.today {
    font-weight: 900;
}

.day.selected {
    background: #111111;
    color: #ffffff;
}

.day.has-note::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 3px;

    width: 3px;
    height: 3px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: #111111;
}

.day.selected.has-note::after {
    background: #ffffff;
}

/* ========================================
   左側リスト全体
======================================== */

.sidebar-content {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* ========================================
   日程メモ
======================================== */

.section {
    display: flex;
    flex-direction: column;

    min-height: 0;
}

.schedule-section {
    flex: 1;

    border-bottom: 1px solid #dddddd;
}

.normal-section {
    flex: 1;
}

.section-header {
    height: 38px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px;

    border-bottom: 1px solid #e2e2e2;
}

.section-title {
    font-size: 11px;
    font-weight: 900;
}

.section-count {
    font-size: 9px;
    color: #999999;
}

.section-search {
    flex-shrink: 0;

    padding: 8px 14px;
}

.section-search input {
    width: 100%;
    height: 28px;

    border: 1px solid #d8d8d8;

    background: #ffffff;

    outline: none;

    padding: 0 8px;

    font-size: 10px;
}

.section-search input:focus {
    border-color: #111111;
}

.section-list {
    flex: 1;
    min-height: 0;

    overflow-y: auto;
}

/* ========================================
   日程メモ項目
======================================== */

.schedule-item {
    padding: 9px 14px;

    border-bottom: 1px solid #e9e9e9;

    cursor: pointer;
}

.schedule-item:hover {
    background: #f0f0f0;
}

.schedule-item.active {
    background: #e5e5e5;
}

.schedule-date {
    font-size: 10px;
    font-weight: 900;

    margin-bottom: 3px;
}

.schedule-preview {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 10px;
    color: #777777;
}

/* ========================================
   普通メモ項目
======================================== */

.note-item {
    padding: 10px 14px;

    border-bottom: 1px solid #e9e9e9;

    cursor: pointer;
}

.note-item:hover {
    background: #f0f0f0;
}

.note-item.active {
    background: #e5e5e5;
}

.note-item-title {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 11px;
    font-weight: 800;

    margin-bottom: 3px;
}

.note-item-preview {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 10px;
    color: #777777;
}

.empty-list {
    padding: 18px 14px;

    font-size: 10px;

    color: #999999;

    line-height: 1.6;
}

/* ========================================
   エディタ
======================================== */

.editor-area {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: #ffffff;
}

.editor-top {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid #e5e5e5;
}

.editor-heading {
    min-width: 0;
}

.editor-date {
    font-size: 11px;

    color: #777777;

    margin-bottom: 3px;
}

.editor-title {
    width: 100%;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    color: #111111;

    font-size: 18px;
    font-weight: 900;
}

.editor-title::placeholder {
    color: #aaaaaa;
}

.editor-status {
    flex-shrink: 0;

    font-size: 10px;

    color: #999999;
}

/* ========================================
   本文
======================================== */

.editor-body {
    flex: 1;
    min-height: 0;

    padding: 30px;

    overflow-y: auto;
}

.editor {
    width: 100%;
    height: 100%;

    min-height: 300px;

    resize: none;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    color: #000000;

    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    font-size: 15px;

    line-height: 1.9;
}

.editor::placeholder {
    color: #999999;
}

/* ========================================
   ステータス
======================================== */

.statusbar {
    height: 32px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px 0 30px;

    border-top: 1px solid #e5e5e5;

    color: #888888;

    font-size: 10px;
}

.status-left,
.status-right {
    display: flex;
    align-items: center;

    gap: 14px;
}

/* ========================================
   スクロールバー
======================================== */

::-webkit-scrollbar {
    width: 7px;
    height: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #cfcfcf;
}

::-webkit-scrollbar-thumb:hover {
    background: #aaaaaa;
}

/* ========================================
   モバイル
======================================== */

@media (max-width: 760px) {

    body {
        overflow: auto;
    }

    .header {
        padding: 0 12px;
    }

    .logo-line,
    .current-date {
        display: none;
    }

    .header-button:not(.primary) {
        display: none;
    }

    .main {
        height: calc(100vh - 58px);
    }

    .sidebar {
        width: 220px;
    }

    .editor-top {
        padding: 0 18px;
    }

    .editor-body {
        padding: 20px 18px;
    }

    .statusbar {
        padding-left: 18px;
    }
}

@media (max-width: 560px) {

    .sidebar {
        width: 180px;
    }

    .calendar-section {
        padding-left: 8px;
        padding-right: 8px;
    }

    .search-area {
        padding-left: 8px;
        padding-right: 8px;
    }

    .section-header {
        padding-left: 8px;
        padding-right: 8px;
    }

    .section-search {
        padding-left: 8px;
        padding-right: 8px;
    }

    .schedule-item,
    .note-item {
        padding-left: 8px;
        padding-right: 8px;
    }

    .editor-top {
        padding: 0 12px;
    }

    .editor-body {
        padding: 18px 12px;
    }

    .statusbar {
        padding-left: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================
         ヘッダー
    ====================================== -->

    <header class="header">

        <div class="logo-area">

            <div class="logo">
                DOL NOTE
            </div>

            <div class="logo-line"></div>

            <div
                class="current-date"
                id="currentDate"
            ></div>

        </div>


        <div class="header-actions">

            <button
                class="header-button"
                id="todayButton"
            >
                今日
            </button>

            <button
                class="header-button"
                id="saveTxtButton"
            >
                TXT保存
            </button>

            <button
                class="header-button primary"
                id="newButton"
            >
                ＋ 普通のメモ
            </button>

        </div>

    </header>


    <!-- =====================================
         メイン
    ====================================== -->

    <main class="main">

        <!-- =================================
             左
        ================================== -->

        <aside class="sidebar">

            <!-- カレンダー -->

            <section class="calendar-section">

                <div class="calendar-top">

                    <div
                        class="month-label"
                        id="monthLabel"
                    ></div>

                    <div class="month-controls">

                        <button
                            class="month-button"
                            id="prevMonth"
                        >
                            ‹
                        </button>

                        <button
                            class="month-button"
                            id="nextMonth"
                        >
                            ›
                        </button>

                    </div>

                </div>


                <div class="calendar-week">

                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>

                </div>


                <div
                    class="calendar-grid"
                    id="calendarGrid"
                ></div>

            </section>


            <div class="sidebar-content">

                <!-- =================================
                     日程メモ
                ================================== -->

                <section class="section schedule-section">

                    <div class="section-header">

                        <div class="section-title">
                            日程メモ
                        </div>

                        <div
                            class="section-count"
                            id="scheduleCount"
                        >
                            0件
                        </div>

                    </div>


                    <div class="section-search">

                        <input
                            type="search"
                            id="scheduleSearch"
                            placeholder="日程メモを検索"
                        >

                    </div>


                    <div
                        class="section-list"
                        id="scheduleList"
                    ></div>

                </section>


                <!-- =================================
                     普通のメモ
                ================================== -->

                <section class="section normal-section">

                    <div class="section-header">

                        <div class="section-title">
                            普通のメモ
                        </div>

                        <div
                            class="section-count"
                            id="normalCount"
                        >
                            0件
                        </div>

                    </div>


                    <div class="section-search">

                        <input
                            type="search"
                            id="normalSearch"
                            placeholder="普通のメモを検索"
                        >

                    </div>


                    <div
                        class="section-list"
                        id="normalList"
                    ></div>

                </section>

            </div>

        </aside>


        <!-- =================================
             エディタ
        ================================== -->

        <section class="editor-area">

            <div class="editor-top">

                <div class="editor-heading">

                    <div
                        class="editor-date"
                        id="editorDate"
                    >
                        メモ
                    </div>

                    <input
                        class="editor-title"
                        id="titleInput"
                        placeholder="タイトルなし"
                        autocomplete="off"
                    >

                </div>


                <div
                    class="editor-status"
                    id="editorStatus"
                >
                    保存済み
                </div>

            </div>


            <div class="editor-body">

                <textarea
                    class="editor"
                    id="editor"
                    placeholder="ここにメモを書く..."
                    spellcheck="true"
                ></textarea>

            </div>


            <div class="statusbar">

                <div class="status-left">

                    <span id="wordCount">
                        0文字
                    </span>

                    <span id="lineCount">
                        1行
                    </span>

                </div>


                <div class="status-right">

                    <span id="typeStatus">
                        普通のメモ
                    </span>

                    <span id="saveStatus">
                        保存済み
                    </span>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

/* =====================================================
   DOL NOTE
===================================================== */

const STORAGE_KEY =
    "DOL_NOTE_DATA_V2";


/* =====================================================
   状態
===================================================== */

let normalNotes = [];

let scheduleNotes = [];

let selectedId = null;

let selectedType = null;

/*
    scheduleDraft は保存前の日程メモ。

    カレンダーをクリックしただけでは
    ここに一時的に作られるだけ。

    文字を入力した瞬間に正式保存する。
*/
let scheduleDraft = null;


/* カレンダー */

const today = new Date();

let calendarYear =
    today.getFullYear();

let calendarMonth =
    today.getMonth();


/* =====================================================
   DOM
===================================================== */

const calendarGrid =
    document.getElementById(
        "calendarGrid"
    );

const monthLabel =
    document.getElementById(
        "monthLabel"
    );

const scheduleList =
    document.getElementById(
        "scheduleList"
    );

const normalList =
    document.getElementById(
        "normalList"
    );

const scheduleSearch =
    document.getElementById(
        "scheduleSearch"
    );

const normalSearch =
    document.getElementById(
        "normalSearch"
    );

const scheduleCount =
    document.getElementById(
        "scheduleCount"
    );

const normalCount =
    document.getElementById(
        "normalCount"
    );

const titleInput =
    document.getElementById(
        "titleInput"
    );

const editor =
    document.getElementById(
        "editor"
    );

const editorDate =
    document.getElementById(
        "editorDate"
    );

const editorStatus =
    document.getElementById(
        "editorStatus"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );

const typeStatus =
    document.getElementById(
        "typeStatus"
    );

const wordCount =
    document.getElementById(
        "wordCount"
    );

const lineCount =
    document.getElementById(
        "lineCount"
    );


/* =====================================================
   ID
===================================================== */

function createId() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =====================================================
   日付
===================================================== */

function formatDateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;

}


function formatJapaneseDate(dateKey) {

    const parts =
        dateKey.split("-");

    return (
        `${Number(parts[0])}年` +
        `${Number(parts[1])}月` +
        `${Number(parts[2])}日`
    );

}


/* =====================================================
   今日
===================================================== */

function isToday(dateKey) {

    return (
        dateKey ===
        formatDateKey(new Date())
    );

}


/* =====================================================
   データ読み込み
===================================================== */

function loadData() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            normalNotes = [];
            scheduleNotes = [];
            return;
        }


        const data =
            JSON.parse(saved);


        normalNotes =
            Array.isArray(
                data.normalNotes
            )
                ? data.normalNotes
                : [];


        scheduleNotes =
            Array.isArray(
                data.scheduleNotes
            )
                ? data.scheduleNotes
                : [];


    } catch {

        normalNotes = [];
        scheduleNotes = [];

    }

}


/* =====================================================
   データ保存
===================================================== */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify({

            normalNotes,
            scheduleNotes

        })

    );


    saveStatus.textContent =
        "保存済み";

}


/* =====================================================
   カレンダー描画
===================================================== */

function renderCalendar() {

    monthLabel.textContent =
        `${calendarYear}年${calendarMonth + 1}月`;

    calendarGrid.innerHTML = "";


    const firstDay =
        new Date(
            calendarYear,
            calendarMonth,
            1
        );


    const lastDay =
        new Date(
            calendarYear,
            calendarMonth + 1,
            0
        );


    const startWeekday =
        firstDay.getDay();


    const daysInMonth =
        lastDay.getDate();


    /*
        前月
    */

    const previousLastDay =
        new Date(
            calendarYear,
            calendarMonth,
            0
        ).getDate();


    for (
        let i = startWeekday - 1;
        i >= 0;
        i--
    ) {

        const day =
            previousLastDay - i;


        const date =
            new Date(
                calendarYear,
                calendarMonth - 1,
                day
            );


        addCalendarDay(
            date,
            true
        );

    }


    /*
        今月
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                calendarYear,
                calendarMonth,
                day
            );


        addCalendarDay(
            date,
            false
        );

    }


    /*
        次月
    */

    const totalCells =
        startWeekday +
        daysInMonth;


    const remaining =
        Math.ceil(
            totalCells / 7
        ) * 7 -
        totalCells;


    for (
        let day = 1;
        day <= remaining;
        day++
    ) {

        const date =
            new Date(
                calendarYear,
                calendarMonth + 1,
                day
            );


        addCalendarDay(
            date,
            true
        );

    }

}


/* =====================================================
   カレンダー日付
===================================================== */

function addCalendarDay(
    date,
    otherMonth
) {

    const key =
        formatDateKey(date);


    const button =
        document.createElement(
            "button"
        );


    button.className = "day";


    if (otherMonth) {
        button.classList.add(
            "other-month"
        );
    }


    if (isToday(key)) {
        button.classList.add(
            "today"
        );
    }


    /*
        その日に日程メモがあるか
    */

    if (
        scheduleNotes.some(
            note =>
                note.date === key
        )
    ) {

        button.classList.add(
            "has-note"
        );

    }


    /*
        現在選択中の日付
    */

    const selectedNote =
        getSelectedNote();


    if (
        selectedNote &&
        selectedNote.type === "schedule" &&
        selectedNote.date === key
    ) {

        button.classList.add(
            "selected"
        );

    }


    /*
        保存前の仮日程メモ
    */

    if (
        scheduleDraft &&
        scheduleDraft.date === key
    ) {

        button.classList.add(
            "selected"
        );

    }


    button.textContent =
        date.getDate();


    button.addEventListener(
        "click",
        () => {

            selectScheduleDate(
                key
            );

        }
    );


    calendarGrid.appendChild(
        button
    );

}


/* =====================================================
   日程メモをカレンダーから選択
===================================================== */

function selectScheduleDate(
    dateKey
) {

    /*
        今編集中の内容を処理
    */

    finalizeCurrentDraft();


    /*
        既存の日程メモ
    */

    const existing =
        scheduleNotes.find(
            note =>
                note.date === dateKey
        );


    if (existing) {

        openScheduleNote(
            existing.id
        );

        return;

    }


    /*
        新しい日程メモ。

        ここではまだ保存しない。
    */

    scheduleDraft = {

        id: createId(),

        type: "schedule",

        title: "",

        content: "",

        date: dateKey,

        updated: Date.now()

    };


    selectedId =
        scheduleDraft.id;

    selectedType =
        "schedule";


    renderAll();

    titleInput.focus();

}


/* =====================================================
   仮日程メモの確定
===================================================== */

function finalizeCurrentDraft() {

    if (!scheduleDraft) {
        return;
    }


    const title =
        scheduleDraft.title.trim();


    const content =
        scheduleDraft.content.trim();


    /*
        タイトルも本文も空
        → 完全に破棄
    */

    if (
        title === "" &&
        content === ""
    ) {

        scheduleDraft = null;

        return;

    }


    /*
        内容がある
        → 正式保存
    */

    scheduleNotes.push(
        scheduleDraft
    );


    scheduleDraft = null;

    saveData();

}


/* =====================================================
   現在のメモ
===================================================== */

function getSelectedNote() {

    if (
        selectedType ===
        "schedule"
    ) {

        if (
            scheduleDraft &&
            scheduleDraft.id === selectedId
        ) {

            return scheduleDraft;

        }


        return scheduleNotes.find(
            note =>
                note.id === selectedId
        );

    }


    if (
        selectedType ===
        "normal"
    ) {

        return normalNotes.find(
            note =>
                note.id === selectedId
        );

    }


    return null;

}


/* =====================================================
   普通のメモ作成
===================================================== */

function createNormalNote() {

    /*
        日程メモを編集中なら確定
    */

    finalizeCurrentDraft();


    const now =
        new Date();


    const note = {

        id: createId(),

        type: "normal",

        title: "",

        content: "",

        date:
            formatDateKey(now),

        updated: Date.now()

    };


    normalNotes.unshift(
        note
    );


    selectedId =
        note.id;

    selectedType =
        "normal";


    saveData();

    renderAll();

    titleInput.focus();

}


/* =====================================================
   普通のメモを開く
===================================================== */

function openNormalNote(id) {

    finalizeCurrentDraft();


    const note =
        normalNotes.find(
            item =>
                item.id === id
        );


    if (!note) {
        return;
    }


    selectedId =
        note.id;

    selectedType =
        "normal";


    renderAll();

    editor.focus();

}


/* =====================================================
   日程メモを開く
===================================================== */

function openScheduleNote(id) {

    finalizeCurrentDraft();


    const note =
        scheduleNotes.find(
            item =>
                item.id === id
        );


    if (!note) {
        return;
    }


    selectedId =
        note.id;

    selectedType =
        "schedule";


    const date =
        new Date(
            note.date +
            "T00:00:00"
        );


    calendarYear =
        date.getFullYear();

    calendarMonth =
        date.getMonth();


    renderAll();

    editor.focus();

}


/* =====================================================
   エディタへ読み込み
===================================================== */

function loadEditor() {

    const note =
        getSelectedNote();


    if (!note) {

        titleInput.value = "";
        editor.value = "";

        editorDate.textContent =
            "メモ";

        typeStatus.textContent =
            "メモ";

        updateStats();

        return;

    }


    titleInput.value =
        note.title || "";


    editor.value =
        note.content || "";


    if (
        note.type ===
        "schedule"
    ) {

        editorDate.textContent =
            formatJapaneseDate(
                note.date
            );


        typeStatus.textContent =
            "日程メモ";

    } else {

        editorDate.textContent =
            "普通のメモ";


        typeStatus.textContent =
            "普通のメモ";

    }


    updateStats();

}


/* =====================================================
   現在の内容を更新
===================================================== */

function updateCurrentNote() {

    const note =
        getSelectedNote();


    if (!note) {
        return;
    }


    note.title =
        titleInput.value;


    note.content =
        editor.value;


    note.updated =
        Date.now();


    /*
        日程メモの場合
        最初の1文字で正式保存
    */

    if (
        note.type === "schedule" &&
        scheduleDraft &&
        scheduleDraft.id === note.id
    ) {

        if (
            note.title.trim() !== "" ||
            note.content.trim() !== ""
        ) {

            scheduleNotes.push(
                scheduleDraft
            );

            scheduleDraft = null;

        }

    }


    saveStatus.textContent =
        "保存中...";


    saveData();

    renderCalendar();

    renderScheduleList();

    renderNormalList();

    updateStats();


    setTimeout(
        () => {

            saveStatus.textContent =
                "保存済み";

        },
        250
    );

}


/* =====================================================
   統計
===================================================== */

function updateStats() {

    const text =
        editor.value;


    wordCount.textContent =
        `${text.length}文字`;


    const lines =
        text.length === 0
            ? 1
            : text.split("\n").length;


    lineCount.textContent =
        `${lines}行`;

}


/* =====================================================
   日程メモ一覧
===================================================== */

function renderScheduleList() {

    const keyword =
        scheduleSearch.value
            .trim()
            .toLowerCase();


    let list =
        [...scheduleNotes];


    if (keyword) {

        list =
            list.filter(
                note => {

                    const target =
                        (
                            note.title +
                            " " +
                            note.content +
                            " " +
                            note.date
                        ).toLowerCase();


                    return target.includes(
                        keyword
                    );

                }
            );

    }


    list.sort(
        (a, b) => {

            if (
                a.date !== b.date
            ) {

                return b.date.localeCompare(
                    a.date
                );

            }

            return (
                b.updated -
                a.updated
            );

        }
    );


    scheduleCount.textContent =
        `${list.length}件`;


    if (list.length === 0) {

        scheduleList.innerHTML = `

            <div class="empty-list">
                日程メモはありません。
            </div>

        `;

        return;

    }


    scheduleList.innerHTML =
        list.map(note => {

            const preview =
                note.content
                    .replace(
                        /\n/g,
                        " "
                    )
                    .trim()
                    ||
                note.title.trim()
                    ||
                "本文なし";


            return `

                <div
                    class="schedule-item ${
                        selectedType === "schedule" &&
                        selectedId === note.id
                            ? "active"
                            : ""
                    }"
                    data-id="${note.id}"
                >

                    <div class="schedule-date">
                        ${formatJapaneseDate(
                            note.date
                        )}
                    </div>

                    <div class="schedule-preview">
                        ${escapeHTML(
                            preview
                        )}
                    </div>

                </div>

            `;

        }).join("");


    document
        .querySelectorAll(
            ".schedule-item"
        )
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    openScheduleNote(
                        item.dataset.id
                    );

                }
            );

        });

}


/* =====================================================
   普通のメモ一覧
===================================================== */

function renderNormalList() {

    const keyword =
        normalSearch.value
            .trim()
            .toLowerCase();


    let list =
        [...normalNotes];


    if (keyword) {

        list =
            list.filter(
                note => {

                    const target =
                        (
                            note.title +
                            " " +
                            note.content
                        ).toLowerCase();


                    return target.includes(
                        keyword
                    );

                }
            );

    }


    list.sort(
        (a, b) =>
            b.updated -
            a.updated
    );


    normalCount.textContent =
        `${list.length}件`;


    if (list.length === 0) {

        normalList.innerHTML = `

            <div class="empty-list">
                普通のメモはありません。
            </div>

        `;

        return;

    }


    normalList.innerHTML =
        list.map(note => {

            const title =
                note.title.trim()
                    ||
                "タイトルなし";


            const preview =
                note.content
                    .replace(
                        /\n/g,
                        " "
                    )
                    .trim()
                    ||
                "本文なし";


            return `

                <div
                    class="note-item ${
                        selectedType === "normal" &&
                        selectedId === note.id
                            ? "active"
                            : ""
                    }"
                    data-id="${note.id}"
                >

                    <div class="note-item-title">
                        ${escapeHTML(
                            title
                        )}
                    </div>

                    <div class="note-item-preview">
                        ${escapeHTML(
                            preview
                        )}
                    </div>

                </div>

            `;

        }).join("");


    document
        .querySelectorAll(
            ".note-item"
        )
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    openNormalNote(
                        item.dataset.id
                    );

                }
            );

        });

}


/* =====================================================
   全体描画
===================================================== */

function renderAll() {

    renderCalendar();

    renderScheduleList();

    renderNormalList();

    loadEditor();

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(text) {

    return text
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   TXT保存
===================================================== */

function saveTxt() {

    /*
        保存前の仮日程メモにも対応
    */

    const note =
        getSelectedNote();


    if (!note) {
        return;
    }


    const title =
        note.title.trim()
        ||
        (
            note.type === "schedule"
                ? "日程メモ"
                : "メモ"
        );


    const dateText =
        formatJapaneseDate(
            note.date
        );


    const text =
`${title}

${dateText}

${note.content}`;


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href = url;

    a.download =
        `${title}.txt`;


    a.click();


    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   今日
===================================================== */

function goToday() {

    finalizeCurrentDraft();


    const now =
        new Date();


    calendarYear =
        now.getFullYear();


    calendarMonth =
        now.getMonth();


    const todayKey =
        formatDateKey(now);


    const existing =
        scheduleNotes.find(
            note =>
                note.date ===
                todayKey
        );


    if (existing) {

        openScheduleNote(
            existing.id
        );

    } else {

        selectScheduleDate(
            todayKey
        );

    }

}


/* =====================================================
   月移動
===================================================== */

document
    .getElementById(
        "prevMonth"
    )
    .addEventListener(
        "click",
        () => {

            finalizeCurrentDraft();


            calendarMonth--;


            if (
                calendarMonth < 0
            ) {

                calendarMonth = 11;
                calendarYear--;

            }


            renderCalendar();

        }
    );


document
    .getElementById(
        "nextMonth"
    )
    .addEventListener(
        "click",
        () => {

            finalizeCurrentDraft();


            calendarMonth++;


            if (
                calendarMonth > 11
            ) {

                calendarMonth = 0;
                calendarYear++;

            }


            renderCalendar();

        }
    );


/* =====================================================
   ボタン
===================================================== */

document
    .getElementById(
        "newButton"
    )
    .addEventListener(
        "click",
        createNormalNote
    );


document
    .getElementById(
        "todayButton"
    )
    .addEventListener(
        "click",
        goToday
    );


document
    .getElementById(
        "saveTxtButton"
    )
    .addEventListener(
        "click",
        saveTxt
    );


/* =====================================================
   検索
===================================================== */

scheduleSearch.addEventListener(
    "input",
    renderScheduleList
);


normalSearch.addEventListener(
    "input",
    renderNormalList
);


/* =====================================================
   入力
===================================================== */

titleInput.addEventListener(
    "input",
    updateCurrentNote
);


editor.addEventListener(
    "input",
    updateCurrentNote
);


/* =====================================================
   キーボード
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
            Ctrl + S
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            finalizeCurrentDraft();

            saveData();

            saveStatus.textContent =
                "保存済み";

        }


        /*
            Ctrl + N
            普通のメモ
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "n"
        ) {

            event.preventDefault();

            createNormalNote();

        }


        /*
            Ctrl + F
            現在の種類に合わせて検索
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();


            if (
                selectedType ===
                "schedule"
            ) {

                scheduleSearch.focus();

            } else {

                normalSearch.focus();

            }

        }

    }
);


/* =====================================================
   ページを離れる前
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        finalizeCurrentDraft();

        saveData();

    }
);


/* =====================================================
   ヘッダー日付
===================================================== */

function updateHeaderDate() {

    const now =
        new Date();


    document
        .getElementById(
            "currentDate"
        )
        .textContent =
        `${now.getFullYear()}年` +
        `${now.getMonth() + 1}月` +
        `${now.getDate()}日`;

}


updateHeaderDate();


/* =====================================================
   起動
===================================================== */

loadData();


/*
    最初に開くメモ

    普通のメモがあればそれを開く。
    なければ今日の日程メモがあれば開く。
    それもなければ何も作らない。
*/

if (
    normalNotes.length > 0
) {

    const latest =
        [...normalNotes]
            .sort(
                (a, b) =>
                    b.updated -
                    a.updated
            )[0];


    selectedId =
        latest.id;

    selectedType =
        "normal";

} else if (
    scheduleNotes.length > 0
) {

    const latest =
        [...scheduleNotes]
            .sort(
                (a, b) =>
                    b.updated -
                    a.updated
            )[0];


    selectedId =
        latest.id;

    selectedType =
        "schedule";

}


renderAll();

</script>

</body>
</html>
