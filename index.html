<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL NOTE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family:
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    color: #222;
    background: #f4f4f4;
}

body {
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
}

/* =========================
   HEADER
========================= */

.header {
    height: 54px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    background: #fff;
}

.logo {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
}

.file-name {
    margin-left: 24px;
    color: #555;
    font-size: 13px;
}

.header-actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
}

/* =========================
   BUTTONS
========================= */

button {
    font-family: inherit;
}

.top-button {
    height: 32px;
    padding: 0 11px;
    border: 1px solid #d4d4d4;
    border-radius: 5px;
    background: #fff;
    color: #333;
    cursor: pointer;
    font-size: 12px;
}

.top-button:hover {
    background: #f3f3f3;
}

.top-button:active {
    background: #e9e9e9;
}

/* =========================
   MENU
========================= */

.menu-bar {
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-left: 12px;
    border-bottom: 1px solid #ddd;
    background: #fafafa;
}

.menu-button {
    height: 30px;
    padding: 0 10px;
    border: 0;
    background: transparent;
    color: #333;
    cursor: pointer;
    font-size: 12px;
}

.menu-button:hover {
    background: #e8e8e8;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    border-bottom: 1px solid #ddd;
    background: #fff;
}

.tool-button {
    width: 32px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: #333;
    cursor: pointer;
    font-size: 13px;
}

.tool-button:hover {
    background: #eee;
    border-color: #ddd;
}

.tool-button.active {
    background: #ddd;
    border-color: #ccc;
}

.toolbar-separator {
    width: 1px;
    height: 23px;
    background: #ddd;
    margin: 0 5px;
}

.font-select {
    height: 30px;
    border: 1px solid #d2d2d2;
    border-radius: 4px;
    background: #fff;
    padding: 0 7px;
    color: #333;
    font-size: 12px;
    outline: none;
}

.color-button {
    width: 32px;
    height: 30px;
    padding: 3px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
}

.color-button:hover {
    background: #eee;
    border-color: #ddd;
}

.color-preview {
    display: block;
    width: 22px;
    height: 22px;
    border: 1px solid #aaa;
    background: #222;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 245px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ddd;
    background: #f8f8f8;
}

.sidebar-header {
    height: 46px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #ddd;
}

.sidebar-title {
    font-size: 12px;
    font-weight: 600;
    color: #555;
}

.new-note {
    margin-left: auto;
    width: 28px;
    height: 28px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
}

.new-note:hover {
    background: #eee;
}

.search-box {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.search-input {
    width: 100%;
    height: 32px;
    padding: 0 9px;
    border: 1px solid #d2d2d2;
    border-radius: 4px;
    background: #fff;
    outline: none;
    font-size: 12px;
}

.search-input:focus {
    border-color: #999;
}

.notes-list {
    flex: 1;
    overflow-y: auto;
}

.note-item {
    position: relative;
    padding: 11px 13px;
    border-bottom: 1px solid #e5e5e5;
    cursor: pointer;
    background: #f8f8f8;
}

.note-item:hover {
    background: #eee;
}

.note-item.active {
    background: #e2e2e2;
}

.note-item-title {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.note-item-preview {
    margin-top: 5px;
    color: #777;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.note-item-date {
    margin-top: 6px;
    color: #999;
    font-size: 10px;
}

.note-delete {
    position: absolute;
    top: 9px;
    right: 8px;
    display: none;
    width: 23px;
    height: 23px;
    border: 0;
    background: transparent;
    color: #777;
    cursor: pointer;
}

.note-item:hover .note-delete {
    display: block;
}

.note-delete:hover {
    color: #c00;
}

/* =========================
   EDITOR
========================= */

.editor-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
}

.editor-title {
    width: 100%;
    height: 56px;
    flex-shrink: 0;
    padding: 16px 25px 8px;
    border: 0;
    outline: none;
    font-size: 20px;
    font-weight: 600;
    color: #222;
}

.editor-title::placeholder {
    color: #aaa;
}

.editor {
    flex: 1;
    width: 100%;
    min-height: 0;
    resize: none;
    padding: 10px 25px 30px;
    border: 0;
    outline: none;
    background: #fff;
    color: #222;
    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    font-size: 14px;
    line-height: 1.8;
}

/* =========================
   STATUS BAR
========================= */

.status-bar {
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-top: 1px solid #ddd;
    background: #f7f7f7;
    color: #777;
    font-size: 10px;
}

.status-left {
    display: flex;
    gap: 18px;
}

.status-right {
    margin-left: auto;
}

/* =========================
   EMPTY
========================= */

.empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}

/* =========================
   COLOR INPUT
========================= */

.hidden-color {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 190px;
    }

    .file-name {
        display: none;
    }

    .editor-title {
        padding-left: 15px;
    }

    .editor {
        padding-left: 15px;
        padding-right: 15px;
    }

}

@media (max-width: 550px) {

    .sidebar {
        width: 150px;
    }

    .toolbar {
        overflow-x: auto;
    }

    .status-left {
        gap: 8px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            DOL NOTE
        </div>

        <div
            class="file-name"
            id="headerFileName"
        >
            無題
        </div>

        <div class="header-actions">

            <button
                class="top-button"
                onclick="newNote()"
            >
                新規
            </button>

            <button
                class="top-button"
                onclick="downloadTxt()"
            >
                保存
            </button>

        </div>

    </header>


    <!-- MENU -->

    <nav class="menu-bar">

        <button
            class="menu-button"
            onclick="newNote()"
        >
            ファイル
        </button>

        <button
            class="menu-button"
            onclick="undoEdit()"
        >
            編集
        </button>

        <button
            class="menu-button"
            onclick="focusEditor()"
        >
            表示
        </button>

    </nav>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            class="tool-button"
            title="太字"
            onclick="formatText('bold')"
        >
            <b>B</b>
        </button>

        <button
            class="tool-button"
            title="斜体"
            onclick="formatText('italic')"
        >
            <i>I</i>
        </button>

        <button
            class="tool-button"
            title="下線"
            onclick="formatText('underline')"
        >
            <u>U</u>
        </button>

        <div class="toolbar-separator"></div>

        <select
            class="font-select"
            id="fontSize"
            onchange="changeFontSize()"
        >
            <option value="14">14px</option>
            <option value="16">16px</option>
            <option value="18">18px</option>
            <option value="20">20px</option>
            <option value="24">24px</option>
            <option value="28">28px</option>
        </select>

        <div class="toolbar-separator"></div>

        <button
            class="tool-button"
            onclick="insertText('・')"
            title="箇条書き"
        >
            •
        </button>

        <button
            class="tool-button"
            onclick="insertText('→ ')"
            title="矢印"
        >
            →
        </button>

        <button
            class="tool-button"
            onclick="insertText('【】')"
            title="括弧"
        >
            【】
        </button>

        <div class="toolbar-separator"></div>

        <label
            class="color-button"
            title="文字色"
        >
            <span
                class="color-preview"
                id="colorPreview"
            ></span>

            <input
                class="hidden-color"
                type="color"
                id="textColor"
                value="#222222"
                onchange="changeTextColor()"
            >
        </label>

    </div>


    <!-- MAIN -->

    <main class="main">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="sidebar-title">
                    ノート
                </div>

                <button
                    class="new-note"
                    onclick="newNote()"
                    title="新しいノート"
                >
                    +
                </button>

            </div>

            <div class="search-box">

                <input
                    class="search-input"
                    id="searchInput"
                    type="text"
                    placeholder="ノートを検索"
                    oninput="renderNotes()"
                >

            </div>

            <div
                class="notes-list"
                id="notesList"
            ></div>

        </aside>


        <!-- EDITOR -->

        <section class="editor-area">

            <div id="editorContainer">

                <input
                    class="editor-title"
                    id="noteTitle"
                    type="text"
                    placeholder="タイトル"
                    autocomplete="off"
                >

                <textarea
                    class="editor"
                    id="editor"
                    placeholder="ここに入力..."
                    spellcheck="false"
                ></textarea>

            </div>

            <div
                class="empty"
                id="emptyMessage"
                style="display:none;"
            >
                ノートを選択してください
            </div>

        </section>

    </main>


    <!-- STATUS -->

    <footer class="status-bar">

        <div class="status-left">

            <span id="charCount">
                0文字
            </span>

            <span id="lineCount">
                1行
            </span>

            <span id="saveStatus">
                保存済み
            </span>

        </div>

        <div class="status-right">
            DOL NOTE
        </div>

    </footer>

</div>


<script>

/* =========================
   DATA
========================= */

const STORAGE_KEY = "dol_note_data";

let notes = [];
let currentNoteId = null;


/* =========================
   ELEMENTS
========================= */

const noteTitle =
    document.getElementById("noteTitle");

const editor =
    document.getElementById("editor");

const notesList =
    document.getElementById("notesList");

const searchInput =
    document.getElementById("searchInput");

const headerFileName =
    document.getElementById("headerFileName");

const charCount =
    document.getElementById("charCount");

const lineCount =
    document.getElementById("lineCount");

const saveStatus =
    document.getElementById("saveStatus");


/* =========================
   LOAD
========================= */

function loadNotes() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            notes = JSON.parse(saved);

        } catch {

            notes = [];

        }

    }

    if (!Array.isArray(notes)) {
        notes = [];
    }

    renderNotes();

    if (notes.length > 0) {

        openNote(notes[0].id);

    } else {

        newNote();

    }
}


/* =========================
   SAVE
========================= */

function saveNotes() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

    saveStatus.textContent =
        "保存済み";
}


/* =========================
   NEW NOTE
========================= */

function newNote() {

    const now = Date.now();

    const newNoteData = {

        id: now,

        title: "無題",

        content: "",

        updated: now

    };

    notes.unshift(newNoteData);

    currentNoteId =
        newNoteData.id;

    saveNotes();

    renderNotes();

    loadCurrentNote();

    noteTitle.focus();

}


/* =========================
   OPEN NOTE
========================= */

function openNote(id) {

    const found =
        notes.find(
            note => note.id === id
        );

    if (!found) {
        return;
    }

    currentNoteId = id;

    loadCurrentNote();

    renderNotes();

}


/* =========================
   LOAD CURRENT
========================= */

function loadCurrentNote() {

    const note =
        notes.find(
            item => item.id === currentNoteId
        );

    if (!note) {

        document.getElementById(
            "editorContainer"
        ).style.display = "none";

        document.getElementById(
            "emptyMessage"
        ).style.display = "flex";

        return;

    }

    document.getElementById(
        "editorContainer"
    ).style.display = "block";

    document.getElementById(
        "emptyMessage"
    ).style.display = "none";

    noteTitle.value =
        note.title;

    editor.value =
        note.content;

    headerFileName.textContent =
        note.title || "無題";

    updateStats();

}


/* =========================
   UPDATE NOTE
========================= */

function updateCurrentNote() {

    const note =
        notes.find(
            item => item.id === currentNoteId
        );

    if (!note) {
        return;
    }

    note.title =
        noteTitle.value.trim() || "無題";

    note.content =
        editor.value;

    note.updated =
        Date.now();

    headerFileName.textContent =
        note.title;

    saveStatus.textContent =
        "保存中...";

    clearTimeout(
        window.saveTimer
    );

    window.saveTimer =
        setTimeout(
            function () {

                saveNotes();

                renderNotes();

            },
            300
        );

    updateStats();

}


/* =========================
   RENDER NOTES
========================= */

function renderNotes() {

    const keyword =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";

    notesList.innerHTML = "";

    const filtered =
        notes.filter(
            note => {

                const title =
                    note.title.toLowerCase();

                const content =
                    note.content.toLowerCase();

                return (
                    title.includes(keyword) ||
                    content.includes(keyword)
                );

            }
        );

    filtered.forEach(
        function(note) {

            const item =
                document.createElement("div");

            item.className =
                "note-item";

            if (
                note.id === currentNoteId
            ) {

                item.classList.add(
                    "active"
                );

            }

            const title =
                document.createElement("div");

            title.className =
                "note-item-title";

            title.textContent =
                note.title || "無題";


            const preview =
                document.createElement("div");

            preview.className =
                "note-item-preview";

            preview.textContent =
                note.content
                    .replace(/\n/g, " ")
                    .slice(0, 55)
                    ||
                "内容なし";


            const date =
                document.createElement("div");

            date.className =
                "note-item-date";

            date.textContent =
                formatDate(note.updated);


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "note-delete";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "削除";


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteNote(note.id);

                };


            item.appendChild(title);
            item.appendChild(preview);
            item.appendChild(date);
            item.appendChild(deleteButton);


            item.onclick =
                function() {

                    openNote(note.id);

                };


            notesList.appendChild(item);

        }
    );

}


/* =========================
   DELETE
========================= */

function deleteNote(id) {

    const target =
        notes.find(
            note => note.id === id
        );

    if (!target) {
        return;
    }

    const confirmed =
        confirm(
            `「${target.title}」を削除しますか？`
        );

    if (!confirmed) {
        return;
    }

    notes =
        notes.filter(
            note => note.id !== id
        );

    if (currentNoteId === id) {

        if (notes.length > 0) {

            currentNoteId =
                notes[0].id;

            loadCurrentNote();

        } else {

            currentNoteId =
                null;

            newNote();

        }

    }

    saveNotes();

    renderNotes();

}


/* =========================
   DATE
========================= */

function formatDate(timestamp) {

    const date =
        new Date(timestamp);

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    const hour =
        String(
            date.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            date.getMinutes()
        ).padStart(2, "0");

    return (
        `${year}/${month}/${day} ${hour}:${minute}`
    );

}


/* =========================
   STATS
========================= */

function updateStats() {

    const text =
        editor.value;

    charCount.textContent =
        `${text.length}文字`;

    const lines =
        text.length === 0
            ? 1
            : text.split("\n").length;

    lineCount.textContent =
        `${lines}行`;

}


/* =========================
   TEXT INSERT
========================= */

function insertText(text) {

    const start =
        editor.selectionStart;

    const end =
        editor.selectionEnd;

    const before =
        editor.value.substring(
            0,
            start
        );

    const after =
        editor.value.substring(
            end
        );

    editor.value =
        before +
        text +
        after;

    editor.focus();

    const position =
        start + text.length;

    editor.selectionStart =
        position;

    editor.selectionEnd =
        position;

    updateCurrentNote();

}


/* =========================
   FORMAT
========================= */

function formatText(type) {

    const start =
        editor.selectionStart;

    const end =
        editor.selectionEnd;

    if (start === end) {
        return;
    }

    const selected =
        editor.value.substring(
            start,
            end
        );

    let replacement =
        selected;


    if (type === "bold") {

        replacement =
            `**${selected}**`;

    }

    if (type === "italic") {

        replacement =
            `*${selected}*`;

    }

    if (type === "underline") {

        replacement =
            `<u>${selected}</u>`;

    }


    editor.value =
        editor.value.substring(
            0,
            start
        ) +
        replacement +
        editor.value.substring(
            end
        );


    editor.focus();

    editor.selectionStart =
        start;

    editor.selectionEnd =
        start + replacement.length;

    updateCurrentNote();

}


/* =========================
   FONT SIZE
========================= */

function changeFontSize() {

    const size =
        document.getElementById(
            "fontSize"
        ).value;

    editor.style.fontSize =
        `${size}px`;

}


/* =========================
   TEXT COLOR
========================= */

function changeTextColor() {

    const input =
        document.getElementById(
            "textColor"
        );

    const preview =
        document.getElementById(
            "colorPreview"
        );

    preview.style.background =
        input.value;

    /*
       textareaでは文字の一部分だけ
       色を変えることができないため、
       今回はエディター全体の文字色を変更。
    */

    editor.style.color =
        input.value;

}


/* =========================
   UNDO
========================= */

function undoEdit() {

    document.execCommand(
        "undo"
    );

    updateCurrentNote();

}


/* =========================
   FOCUS
========================= */

function focusEditor() {

    editor.focus();

}


/* =========================
   DOWNLOAD TXT
========================= */

function downloadTxt() {

    const note =
        notes.find(
            item => item.id === currentNoteId
        );

    if (!note) {
        return;
    }

    const content =
        note.content;

    const blob =
        new Blob(
            [content],
            {
                type: "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        `${note.title || "無題"}.txt`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}


/* =========================
   KEYBOARD SHORTCUTS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveNotes();

            downloadTxt();

        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "n"
        ) {

            event.preventDefault();

            newNote();

        }

    }
);


/* =========================
   EVENTS
========================= */

noteTitle.addEventListener(
    "input",
    updateCurrentNote
);

editor.addEventListener(
    "input",
    updateCurrentNote
);


/* =========================
   START
========================= */

loadNotes();

</script>

</body>
</html>
