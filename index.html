<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL NOTE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f5f3ee;
    color: #111;
    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
}

/* =========================
   全体
========================= */

.app {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   ヘッダー
========================= */

.header {
    height: 72px;
    border-bottom: 1px solid #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    background: #f5f3ee;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-left: 8px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.clock {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.new-button {
    border: 1px solid #111;
    background: #111;
    color: white;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.new-button:hover {
    background: #333;
}

/* =========================
   メイン
========================= */

.main {
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 55px 30px 80px;
}

/* =========================
   入力エリア
========================= */

.write-area {
    max-width: 850px;
    margin: 0 auto 80px;
}

.write-label {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

.write-title {
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -2px;
    margin: 0 0 30px;
}

.editor-wrap {
    border-top: 2px solid #111;
    border-bottom: 1px solid #111;
}

.editor {
    width: 100%;
    min-height: 180px;
    padding: 25px 0;
    border: 0;
    outline: 0;
    resize: vertical;
    background: transparent;
    color: #111;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.9;
}

.editor::placeholder {
    color: #777;
}

.write-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
}

.hint {
    color: #666;
    font-size: 12px;
}

.save-button {
    border: 1px solid #111;
    background: transparent;
    color: #111;
    padding: 10px 24px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
}

.save-button:hover {
    background: #111;
    color: white;
}

/* =========================
   検索
========================= */

.timeline-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    border-bottom: 2px solid #111;
    padding-bottom: 14px;
    margin-bottom: 0;
}

.timeline-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -1px;
}

.count {
    font-size: 12px;
    font-weight: 700;
}

.search {
    width: 250px;
    border: 0;
    border-bottom: 1px solid #111;
    background: transparent;
    outline: none;
    padding: 8px 0;
    font-family: inherit;
    font-size: 13px;
}

/* =========================
   タイムライン
========================= */

.timeline {
    position: relative;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 130px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #111;
}

.note {
    position: relative;
    display: grid;
    grid-template-columns: 130px 1fr;
    border-bottom: 1px solid #c9c6bf;
    min-height: 145px;
}

.note-time {
    padding: 25px 25px 25px 0;
    text-align: right;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.5;
}

.note-time .date {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
}

.note-content {
    padding: 25px 0 25px 38px;
    cursor: pointer;
    position: relative;
}

.note-content:hover {
    background: rgba(0, 0, 0, 0.025);
}

.note-dot {
    position: absolute;
    width: 9px;
    height: 9px;
    background: #111;
    border-radius: 50%;
    left: -4px;
    top: 31px;
}

.note-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 16px;
    line-height: 1.8;
    font-weight: 500;
    max-width: 760px;
}

.note-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 13px;
    color: #777;
    font-size: 11px;
}

.pin {
    cursor: pointer;
    border: 0;
    background: transparent;
    color: #777;
    padding: 0;
    font-family: inherit;
    font-size: 11px;
}

.pin.active {
    color: #111;
    font-weight: 900;
}

/* =========================
   空状態
========================= */

.empty {
    padding: 80px 20px;
    text-align: center;
    color: #777;
    border-bottom: 1px solid #111;
}

.empty-big {
    font-size: 18px;
    font-weight: 900;
    color: #111;
    margin-bottom: 10px;
}

.empty-small {
    font-size: 12px;
}

/* =========================
   編集モーダル
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(245, 243, 238, 0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(850px, 100%);
    border: 1px solid #111;
    background: #f5f3ee;
    padding: 30px;
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-title {
    font-size: 13px;
    font-weight: 900;
}

.close {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
    color: #111;
}

.edit-area {
    width: 100%;
    min-height: 300px;
    border: 0;
    border-top: 2px solid #111;
    border-bottom: 1px solid #111;
    outline: none;
    resize: vertical;
    background: transparent;
    padding: 25px 0;
    color: #111;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.9;
}

.modal-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
}

.delete-button {
    border: 0;
    background: transparent;
    color: #b00000;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
}

.update-button {
    border: 1px solid #111;
    background: #111;
    color: white;
    padding: 10px 22px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 900;
}

/* =========================
   レスポンシブ
========================= */

@media (max-width: 700px) {

    .header {
        height: 62px;
        padding: 0 18px;
    }

    .logo {
        font-size: 21px;
    }

    .logo span {
        display: none;
    }

    .clock {
        display: none;
    }

    .main {
        padding: 35px 18px 60px;
    }

    .write-area {
        margin-bottom: 55px;
    }

    .write-title {
        font-size: 36px;
        letter-spacing: -1.5px;
    }

    .editor {
        font-size: 16px;
    }

    .timeline-head {
        display: block;
    }

    .timeline-title {
        margin-bottom: 18px;
    }

    .search {
        width: 100%;
    }

    .timeline::before {
        left: 74px;
    }

    .note {
        grid-template-columns: 74px 1fr;
    }

    .note-time {
        padding: 20px 15px 20px 0;
        font-size: 10px;
    }

    .note-time .date {
        font-size: 9px;
    }

    .note-content {
        padding: 20px 0 20px 25px;
    }

    .note-dot {
        top: 26px;
    }

    .note-text {
        font-size: 14px;
    }

    .modal {
        padding: 15px;
    }

    .modal-box {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            DOL NOTE
            <span>THINK / WRITE / KEEP</span>
        </div>

        <div class="header-right">
            <div class="clock" id="clock"></div>

            <button class="new-button" id="newButton">
                ＋ 新しいメモ
            </button>
        </div>
    </header>


    <main class="main">

        <section class="write-area">

            <div class="write-label">
                NEW NOTE
            </div>

            <h1 class="write-title">
                今、何を考えてる？
            </h1>

            <div class="editor-wrap">
                <textarea
                    id="editor"
                    class="editor"
                    placeholder="思いついたことを、そのまま書く。&#10;&#10;タイトルはいりません。きれいにまとめる必要もありません。"
                ></textarea>
            </div>

            <div class="write-bottom">

                <div class="hint">
                    Ctrl + Enter で保存
                </div>

                <button class="save-button" id="saveButton">
                    保存する
                </button>

            </div>

        </section>


        <section>

            <div class="timeline-head">

                <div>
                    <div class="timeline-title">
                        TIMELINE
                    </div>

                    <div class="count" id="count">
                        0 NOTES
                    </div>
                </div>

                <input
                    type="search"
                    class="search"
                    id="search"
                    placeholder="メモを検索"
                >

            </div>

            <div class="timeline" id="timeline"></div>

        </section>

    </main>

</div>


<!-- 編集モーダル -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-top">

            <div class="modal-title">
                EDIT NOTE
            </div>

            <button class="close" id="closeModal">
                ×
            </button>

        </div>

        <textarea
            class="edit-area"
            id="editArea"
        ></textarea>

        <div class="modal-bottom">

            <button class="delete-button" id="deleteButton">
                このメモを削除
            </button>

            <button class="update-button" id="updateButton">
                保存する
            </button>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "dol_note_timeline_v1";

let notes = [];
let editingId = null;


/* =========================
   初期化
========================= */

function loadNotes() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            notes = JSON.parse(saved);
        }

    } catch (error) {

        notes = [];

    }

    render();

}


function saveNotes() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

}


/* =========================
   ID
========================= */

function createId() {

    return Date.now().toString(36)
        + Math.random().toString(36).slice(2);

}


/* =========================
   日付
========================= */

function formatDate(timestamp) {

    const d = new Date(timestamp);

    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${y}/${m}/${day}`;

}


function formatTime(timestamp) {

    const d = new Date(timestamp);

    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");

    return `${h}:${m}`;

}


/* =========================
   メモ追加
========================= */

function addNote() {

    const editor = document.getElementById("editor");

    const text = editor.value.trim();

    if (!text) {

        editor.focus();

        return;

    }

    const note = {

        id: createId(),

        text: text,

        created: Date.now(),

        pinned: false

    };

    notes.unshift(note);

    saveNotes();

    editor.value = "";

    render();

    editor.focus();

}


/* =========================
   表示
========================= */

function render() {

    const timeline = document.getElementById("timeline");

    const search = document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    let filtered = notes.filter(note => {

        if (!search) {
            return true;
        }

        return note.text
            .toLowerCase()
            .includes(search);

    });


    filtered.sort((a, b) => {

        if (a.pinned !== b.pinned) {
            return a.pinned ? -1 : 1;
        }

        return b.created - a.created;

    });


    document.getElementById("count").textContent =
        `${filtered.length} NOTES`;


    if (filtered.length === 0) {

        timeline.innerHTML = `

            <div class="empty">

                <div class="empty-big">
                    まだメモがありません。
                </div>

                <div class="empty-small">
                    思いついたことを上に書いてください。
                </div>

            </div>

        `;

        return;

    }


    timeline.innerHTML = filtered.map(note => {

        const escaped = escapeHTML(note.text);

        return `

            <article class="note">

                <div class="note-time">

                    <span class="date">
                        ${formatDate(note.created)}
                    </span>

                    ${formatTime(note.created)}

                </div>


                <div
                    class="note-content"
                    data-id="${note.id}"
                >

                    <span class="note-dot"></span>

                    <div class="note-text">
                        ${escaped}
                    </div>

                    <div class="note-meta">

                        <button
                            class="pin ${note.pinned ? "active" : ""}"
                            data-pin="${note.id}"
                        >
                            ${note.pinned ? "PINNED" : "PIN"}
                        </button>

                    </div>

                </div>

            </article>

        `;

    }).join("");


    document.querySelectorAll(".note-content")
        .forEach(element => {

            element.addEventListener("click", event => {

                if (
                    event.target.closest(".pin")
                ) {
                    return;
                }

                openEditor(element.dataset.id);

            });

        });


    document.querySelectorAll("[data-pin]")
        .forEach(button => {

            button.addEventListener("click", event => {

                event.stopPropagation();

                togglePin(button.dataset.pin);

            });

        });

}


/* =========================
   HTML安全処理
========================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
        .replaceAll("\n", "<br>");

}


/* =========================
   PIN
========================= */

function togglePin(id) {

    const note = notes.find(
        note => note.id === id
    );

    if (!note) {
        return;
    }

    note.pinned = !note.pinned;

    saveNotes();

    render();

}


/* =========================
   編集
========================= */

function openEditor(id) {

    const note = notes.find(
        note => note.id === id
    );

    if (!note) {
        return;
    }

    editingId = id;

    document.getElementById("editArea").value =
        note.text;

    document.getElementById("modal")
        .classList.add("show");

    setTimeout(() => {

        document.getElementById("editArea")
            .focus();

    }, 50);

}


function closeEditor() {

    editingId = null;

    document.getElementById("modal")
        .classList.remove("show");

}


function updateNote() {

    if (!editingId) {
        return;
    }

    const text =
        document.getElementById("editArea")
            .value
            .trim();

    if (!text) {
        return;
    }

    const note = notes.find(
        note => note.id === editingId
    );

    if (!note) {
        return;
    }

    note.text = text;

    saveNotes();

    closeEditor();

    render();

}


/* =========================
   削除
========================= */

function deleteNote() {

    if (!editingId) {
        return;
    }

    const index = notes.findIndex(
        note => note.id === editingId
    );

    if (index === -1) {
        return;
    }

    notes.splice(index, 1);

    saveNotes();

    closeEditor();

    render();

}


/* =========================
   時計
========================= */

function updateClock() {

    const now = new Date();

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");

    const h = String(now.getHours()).padStart(2, "0");
    const min = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${y}/${m}/${d}  ${h}:${min}`;

}

setInterval(updateClock, 1000);

updateClock();


/* =========================
   イベント
========================= */

document
    .getElementById("saveButton")
    .addEventListener("click", addNote);


document
    .getElementById("newButton")
    .addEventListener("click", () => {

        document.getElementById("editor")
            .focus();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });


document
    .getElementById("search")
    .addEventListener("input", render);


document
    .getElementById("closeModal")
    .addEventListener("click", closeEditor);


document
    .getElementById("updateButton")
    .addEventListener("click", updateNote);


document
    .getElementById("deleteButton")
    .addEventListener("click", deleteNote);


/* Ctrl + Enter */

document
    .getElementById("editor")
    .addEventListener("keydown", event => {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            event.preventDefault();

            addNote();

        }

    });


/* モーダル外クリック */

document
    .getElementById("modal")
    .addEventListener("click", event => {

        if (
            event.target.id === "modal"
        ) {

            closeEditor();

        }

    });


/* Escape */

document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        document
            .getElementById("modal")
            .classList.contains("show")
    ) {

        closeEditor();

    }

});


/* =========================
   起動
========================= */

loadNotes();

</script>

</body>
</html>
