<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL NOTE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background: #ffffff;
    color: #000000;
    font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
}

button,
input,
select {
    font-family: inherit;
}

button {

}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #d8d8d8;
    background: #ffffff;

.logo {
    font-size: 17px;
    font-weight: 700;

}

.current-name {
    margin-left: 24px;

    max-width: 400px;

    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;

}

.top-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
}

.top-button {
    height: 32px;

    border-radius: 4px;
    background: #ffffff;
    cursor: pointer;
    font-size: 12px;
}

.top-button:hover {
    background: #f2f2f2;
}

.top-button:active {
    background: #e7e7e7;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 12px;
    border-bottom: 1px solid #d8d8d8;
    background: #fafafa;
}

.tool {
    width: 34px;
    height: 32px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

.tool:hover {
    background: #e8e8e8;
    border-color: #d5d5d5;
}

.tool.active {
    background: #dcdcdc;
    border-color: #c7c7c7;
}

.tool-bold {
    font-weight: 700;
}

.tool-italic {
    font-style: italic;
}

.tool-underline {
    text-decoration: underline;

.separator {
    width: 1px;
    height: 25px;
    margin: 0 5px;
    background: #d5d5d5;
}

.select {
    height: 32px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    background: #ffffff;
    color: #000000;
    padding: 0 7px;
    outline: none;
    font-size: 12px;
    cursor: pointer;
}

.font-select {
    width: 150px;
}

.size-select {
    width: 75px;
}

/* =========================
   COLOR
========================= */

.color-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.color-button {
    width: 34px;
    height: 32px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.color-button:hover {
    background: #e8e8e8;
    border-color: #d5d5d5;
}

.color-icon {
    width: 21px;
    height: 21px;
    border: 1px solid #999999;
    display: block;
    background: #000000;
}

.color-input {
    position: absolute;
    left: 0;

    width: 34px;

    cursor: pointer;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;

    display: flex;

}

.sidebar-top {

}

.sidebar-title {

}

.new-button {

/* =========================
   EDITOR
========================= */

}

}

.editor {
    flex: 1;

    font-family:
        "Yu Gothic UI",

.editor:focus:empty::before {

}

.editor p {

}

.editor h1,

.editor h3 {
    margin-top: 18px;

}

.editor h1 {
    font-size: 26px;
}

.editor h2 {
    font-size: 21px;
}

.editor h3 {
    font-size: 18px;
}

.editor ul,
.editor ol {
    padding-left: 28px;
}

/* =========================
   STATUS
========================= */

.status {
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-top: 1px solid #d8d8d8;
    background: #f5f5f5;
    color: #555555;
    font-size: 10px;
}

.status-left {
    display: flex;

}

.status-right {
    margin-left: auto;
}

/* =========================
   CONTEXT MESSAGE
========================= */

.no-note {
    flex: 1;

    align-items: center;

    color: #777777;
    font-size: 13px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {

}

::-webkit-scrollbar-track {
    background: #f4f4f4;
}

::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 0;
}

::-webkit-scrollbar-thumb:hover {
    background: #aaaaaa;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 750px) {

    .sidebar {
        width: 220px;
    }

    .current-name {
        display: none;
    }

    .editor {

        padding-right: 20px;
    }

    .title-input {
        padding-left: 20px;
    }

    .toolbar {
        overflow-x: auto;
    }

}

@media (max-width: 580px) {

    .sidebar {
        width: 185px;
    }

    .font-select {
        width: 120px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <div class="logo">
            DOL NOTE
        </div>

        <div
            class="current-name"
            id="currentName"
        >
            無題
        </div>

        <div class="top-actions">

            <button
                class="top-button"
                onclick="createNote()"
            >
                新規
            </button>

            <button
                class="top-button"
                onclick="downloadCurrentNote()"
            >
                TXT保存
            </button>

        </div>

    </header>


    <!-- =========================
         TOOLBAR
    ========================= -->

    <div class="toolbar">

        <button
            class="tool tool-bold"
            id="boldButton"
            title="太字 Ctrl+B"
            onclick="execFormat('bold')"
        >
            B
        </button>

        <button
            class="tool tool-italic"
            id="italicButton"
            title="斜体 Ctrl+I"
            onclick="execFormat('italic')"
        >
            I
        </button>

        <button
            class="tool tool-underline"
            id="underlineButton"
            title="下線 Ctrl+U"
            onclick="execFormat('underline')"
        >
            U
        </button>

        <div class="separator"></div>

        <select
            class="select font-select"
            id="fontSelect"
            onchange="changeFont()"
            title="フォント"
        >
            <option value='"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif'>
                Yu Gothic
            </option>

            <option value='"Meiryo",sans-serif'>
                Meiryo
            </option>

            <option value='"Segoe UI",sans-serif'>
                Segoe UI
            </option>

            <option value='Arial,sans-serif'>
                Arial
            </option>

            <option value='Consolas,monospace'>
                Consolas
            </option>

            <option value='"MS Gothic",monospace'>
                MS Gothic
            </option>
        </select>

        <select
            class="select size-select"
            id="sizeSelect"
            onchange="changeSize()"
            title="文字サイズ"
        >
            <option value="1">12</option>
            <option value="2">14</option>
            <option value="3" selected>16</option>
            <option value="4">18</option>
            <option value="5">20</option>

            <option value="7">28</option>

        >
            ↷

            title="左揃え"

        >
            ≡
        </button>

        <button
            class="tool"
            title="中央揃え"
            onclick="execFormat('justifyCenter')"
        >
            ≡
        </button>

        <button
            class="tool"
            title="右揃え"
            onclick="execFormat('justifyRight')"
        >
            ≡
        </button>

        <div class="separator"></div>

        <div class="color-wrapper">

                class="color-button"

    <!-- =========================

    ========================= -->

    <main class="main">

        <!-- SIDEBAR -->

                    +
                </button>

                <input

        </div>

<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "dol_note_v2";


let notes = [];

let currentNoteId =
    null;

let savedSelection =
    null;


/* =========================
   ELEMENTS
========================= */

const titleInput =
    document.getElementById(
        "titleInput"
    );

const editor =
    document.getElementById(
        "editor"
    );

const notesElement =
    document.getElementById(
        "notes"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const currentName =
    document.getElementById(
        "currentName"
    );

const charCount =
    document.getElementById(
        "charCount"
    );

const lineCount =
    document.getElementById(
        "lineCount"
    );

const saveState =
    document.getElementById(
        "saveState"
    );


/* =========================
   LOAD
========================= */

function loadData() {

    const data =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (data) {

        try {

            notes =
                JSON.parse(data);

        } catch {

            notes = [];

        }

    }

    if (!Array.isArray(notes)) {
        notes = [];
    }

    if (notes.length === 0) {

        createNote();

    } else {

        openNote(
            notes[0].id
        );

    }

}


/* =========================
   SAVE DATA
========================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

    saveState.textContent =
        "保存済み";

}


/* =========================
   CREATE NOTE
========================= */

function createNote() {

    const id =
        Date.now();

    const note = {

        id: id,

        title: "無題",

        content: "",

        updated:
            Date.now()

    };

    notes.unshift(
        note
    );

    currentNoteId =
        id;

    saveData();

    renderNotes();

    loadCurrentNote();

    titleInput.focus();

}


/* =========================
   OPEN NOTE
========================= */

function openNote(id) {

    const note =
        notes.find(
            item =>
                item.id === id
        );

    if (!note) {
        return;
    }

    currentNoteId =
        id;

    loadCurrentNote();

    renderNotes();

}


/* =========================
   LOAD CURRENT NOTE
========================= */

function loadCurrentNote() {

    const note =
        notes.find(
            item =>
                item.id === currentNoteId
        );

    if (!note) {

        document.getElementById(
            "editorContainer"
        ).style.display =
            "none";

        document.getElementById(
            "noNote"
        ).style.display =
            "flex";

        return;

    }

    document.getElementById(
        "editorContainer"
    ).style.display =
        "flex";

    document.getElementById(
        "editorContainer"
    ).style.flexDirection =
        "column";

    document.getElementById(
        "editorContainer"
    ).style.flex =
        "1";

    document.getElementById(
        "editorContainer"
    ).style.minHeight =
        "0";

    document.getElementById(
        "noNote"
    ).style.display =
        "none";


    titleInput.value =
        note.title || "無題";


    editor.innerHTML =
        note.content || "";


    currentName.textContent =
        note.title || "無題";


    updateStats();

}


/* =========================
   UPDATE CURRENT
========================= */

function updateCurrentNote() {

    const note =
        notes.find(
            item =>
                item.id === currentNoteId
        );

    if (!note) {
        return;
    }


    note.title =
        titleInput.value.trim()
        || "無題";


    note.content =
        editor.innerHTML;


    note.updated =
        Date.now();


    currentName.textContent =
        note.title;


    saveState.textContent =
        "保存中...";


    clearTimeout(
        window.saveTimer
    );


    window.saveTimer =
        setTimeout(
            function() {

                saveData();

                renderNotes();

            },
            350
        );


    updateStats();

}


/* =========================
   RENDER NOTES
========================= */

function renderNotes() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    notesElement.innerHTML =
        "";


    const filtered =
        notes.filter(
            note => {

                const title =
                    note.title
                        .toLowerCase();

                const text =
                    stripHTML(
                        note.content
                    )
                    .toLowerCase();

                return (
                    title.includes(
                        keyword
                    )
                    ||
                    text.includes(
                        keyword
                    )
                );

            }
        );


    filtered.forEach(
        function(note) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "note";


            if (
                note.id ===
                currentNoteId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "note-title";

            title.textContent =
                note.title ||
                "無題";


            const preview =
                document.createElement(
                    "div"
                );

            preview.className =
                "note-preview";

            preview.textContent =
                stripHTML(
                    note.content
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .slice(
                    0,
                    65
                )
                ||
                "内容なし";


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "note-date";

            date.textContent =
                formatDate(
                    note.updated
                );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-note";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "削除";


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteNote(
                        note.id
                    );

                };


            item.appendChild(
                title
            );

            item.appendChild(
                preview
            );

            item.appendChild(
                date
            );

            item.appendChild(
                deleteButton
            );


            item.onclick =
                function() {

                    openNote(
                        note.id
                    );

                };


            notesElement.appendChild(
                item
            );

        }
    );

}


/* =========================
   DELETE
========================= */

function deleteNote(id) {

    const note =
        notes.find(
            item =>
                item.id === id
        );

    if (!note) {
        return;
    }


    const confirmed =
        confirm(
            `「${note.title}」を削除しますか？`
        );


    if (!confirmed) {
        return;
    }


    notes =
        notes.filter(
            item =>
                item.id !== id
        );


    if (
        currentNoteId === id
    ) {

        if (
            notes.length > 0
        ) {

            currentNoteId =
                notes[0].id;

            loadCurrentNote();

        } else {

            currentNoteId =
                null;

            createNote();

        }

    }


    saveData();

    renderNotes();

}


/* =========================
   FORMAT
========================= */

function execFormat(command) {

    editor.focus();

    document.execCommand(
        command,
        false,
        null
    );

    updateToolbarState();

    updateCurrentNote();

}


/* =========================
   FONT
========================= */

function changeFont() {

    const value =
        document.getElementById(
            "fontSelect"
        ).value;


    editor.focus();


    document.execCommand(
        "fontName",
        false,
        value
    );


    updateCurrentNote();

}


/* =========================
   SIZE
========================= */

function changeSize() {

    const value =
        document.getElementById(
            "sizeSelect"
        ).value;


    editor.focus();


    document.execCommand(
        "fontSize",
        false,
        value
    );


    updateCurrentNote();

}


/* =========================
   COLOR
========================= */

const colorInput =
    document.getElementById(
        "colorInput"
    );

const colorIcon =
    document.getElementById(
        "colorIcon"
    );


colorInput.addEventListener(
    "input",
    function() {

        colorIcon.style.background =
            colorInput.value;

    }
);


colorInput.addEventListener(
    "change",
    function() {

        editor.focus();

        document.execCommand(
            "foreColor",
            false,
            colorInput.value
        );

        updateCurrentNote();

    }
);


/* =========================
   TOOLBAR STATE
========================= */

function updateToolbarState() {

    const commands = [
        [
            "bold",
            "boldButton"
        ],
        [
            "italic",
            "italicButton"
        ],
        [
            "underline",
            "underlineButton"
        ]
    ];


    commands.forEach(
        function(pair) {

            const command =
                pair[0];

            const id =
                pair[1];

            const button =
                document.getElementById(
                    id
                );


            try {

                if (
                    document.queryCommandState(
                        command
                    )
                ) {

                    button.classList.add(
                        "active"
                    );

                } else {

                    button.classList.remove(
                        "active"
                    );

                }

            } catch {

                button.classList.remove(
                    "active"
                );

            }

        }
    );

}

/* =========================

========================= */

function updateStats() {

    const text =
        editor.innerText || "";


    charCount.textContent =
        `${text.length}文字`;


    const lines =
        text.length === 0
            ? 1
            : text.split(
                "\n"
            ).length;


    lineCount.textContent =
        `${lines}行`;

}


/* =========================
   STRIP HTML
========================= */

function stripHTML(html) {

    const temporary =
        document.createElement(
            "div"
        );

    temporary.innerHTML =
        html || "";

    return (
        temporary.innerText || ""
    );

}


/* =========================
   DATE
========================= */

function formatDate(timestamp) {

    const date =
        new Date(
            timestamp
        );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const hour =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );


    const minute =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    return (
        `${year}/${month}/${day} ${hour}:${minute}`
    );

}


/* =========================
   DOWNLOAD
========================= */

function downloadCurrentNote() {

    const note =
        notes.find(
            item =>
                item.id ===
                currentNoteId
        );


    if (!note) {
        return;
    }


    const text =
        stripHTML(
            note.content
        );


    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        `${note.title || "無題"}.txt`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}
